<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none">
  <style>
    .route { stroke-dasharray: 7 8; animation: travel 1.3s linear infinite; }
    .route-yellow { animation-delay: .18s; }
    .route-red { animation-delay: .36s; }
    .map-node { transform-box: fill-box; transform-origin: center; animation: pulse 1.7s ease-in-out infinite; }
    .map-node-delay { animation-delay: .25s; }
    .map-node-delay-two { animation-delay: .55s; }
    .map-node-delay-three { animation-delay: .8s; }
    @keyframes travel { to { stroke-dashoffset: -30; } }
    @keyframes pulse { 50% { opacity: .42; transform: scale(.72); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
